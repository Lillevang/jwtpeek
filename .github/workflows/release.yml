# Thin runner for the Taskfile. Every step below is a `task` command that
# works identically on a laptop; GitHub Actions only supplies the machines
# (so a macOS binary gets built too) and a token to attach the assets.
# `task release` pushes the tag that triggers this.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Crystal
        uses: crystal-lang/install-crystal@v1
        with:
          crystal: latest

      - name: Install Task
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl --fail --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - run: task check-tag
      - run: task verify
      - run: task dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Task
        run: |
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl --fail --location https://taskfile.dev/install.sh)" -- -d -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: task publish
        env:
          GH_TOKEN: ${{ github.token }}

# https://taskfile.dev
#
# CI/CD for jwtpeek lives in this file. Every check, build and publish step is
# a `task` command that runs the same way on a laptop as on a GitHub runner;
# .github/workflows/release.yml is only a thin wrapper that calls these tasks
# on a tag push so the binaries get built on Linux *and* macOS. If Actions is
# ever unavailable, `task dist publish` cuts the same release from here.
#
#   task                 same as `task verify`
#   task verify          format check + specs + build + smoke test
#   task bump            bump the patch version (TARGET=minor|major for the others)
#   task release         verify, tag vX.Y.Z and push it — the workflow does the rest
#   task dist publish    build and attach the binary for this machine by hand

version: '3'

# Applies to every command block: a failure anywhere aborts the task, rather
# than Task reporting the exit code of the block's last line.
set: [errexit, nounset, pipefail]

vars:
  BIN: jwtpeek
  VERSION_FILE: src/version.cr
  # src/version.cr is the single source of truth; shard.yml mirrors it and
  # `preflight` refuses to release while the two disagree.
  VERSION:
    sh: grep -Eo 'VERSION[[:space:]]*=[[:space:]]*"[^"]+"' src/version.cr | sed -E 's/.*"([^"]+)".*/\1/'
  TAG: 'v{{.VERSION}}'
  DIST: dist
  # Asset name follows the GoReleaser convention (linux-amd64, darwin-arm64).
  OS:
    sh: uname -s | tr '[:upper:]' '[:lower:]'
  ARCH:
    sh: case "$(uname -m)" in x86_64) echo amd64;; aarch64|arm64) echo arm64;; *) uname -m;; esac
  ASSET: '{{.BIN}}-{{.OS}}-{{.ARCH}}'

tasks:

  default:
    cmds:
      - task: verify

  fmt:
    desc: Format all Crystal sources in place
    cmds:
      - crystal tool format

  lint:
    desc: Fail if any source is not formatted
    cmds:
      - crystal tool format --check

  test:
    desc: Run the spec suite
    cmds:
      - crystal spec

  build:
    desc: Debug build to bin/jwtpeek
    cmds:
      - shards build

  smoke:
    desc: Decode a known token with the freshly built binary
    silent: true
    cmds:
      - |
        # An unsigned token with a fixed payload: the regex, the base64url
        # decoding, the JSON rendering and the alg=none warning all have to
        # work for this to pass. Hand-rolled so the check needs no python/node.
        TOKEN="eyJhbGciOiJub25lIn0.eyJzdWIiOiJzbW9rZSJ9."
        OUT=$(bin/{{.BIN}} --no-color "$TOKEN" 2>&1)
        echo "$OUT" | grep -q '"sub": "smoke"' || { echo "❌ smoke test: payload not decoded"; echo "$OUT"; exit 1; }
        echo "$OUT" | grep -q 'unsigned'       || { echo "❌ smoke test: alg=none not flagged"; echo "$OUT"; exit 1; }
        [ "$(bin/{{.BIN}} --version)" = "{{.VERSION}}" ] || { echo "❌ smoke test: --version printed $(bin/{{.BIN}} --version), expected {{.VERSION}}"; exit 1; }
        echo "✅ Smoke test passed ({{.BIN}} {{.VERSION}})"

  verify:
    desc: Format check, specs, build and smoke test — the local CI run
    cmds:
      - task: lint
      - task: test
      - task: build
      - task: smoke

  bump:
    silent: true
    desc: Bump version in src/version.cr and shard.yml (TARGET=patch|minor|major)
    vars:
      TARGET: '{{.TARGET | default "patch"}}'
    cmds:
      - |
        CURRENT="{{.VERSION}}"
        # Validate before computing: a malformed version would otherwise be
        # coerced by the arithmetic into a plausible-looking wrong one.
        echo "$CURRENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || {
          echo "❌ malformed version in {{.VERSION_FILE}}: '$CURRENT' (want MAJOR.MINOR.PATCH)"
          exit 1
        }
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
        case "{{.TARGET}}" in
          patch) PATCH=$((PATCH+1));;
          minor) MINOR=$((MINOR+1)); PATCH=0;;
          major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0;;
          *) echo "❌ unknown bump target: {{.TARGET}}"; exit 1;;
        esac
        NEW="$MAJOR.$MINOR.$PATCH"
        sed -i.bak -E "s/VERSION[[:space:]]*=[[:space:]]*\"[^\"]*\"/VERSION = \"$NEW\"/" {{.VERSION_FILE}} && rm -f {{.VERSION_FILE}}.bak
        sed -i.bak -E "s/^version:.*/version: $NEW/" shard.yml && rm -f shard.yml.bak
        echo "🔼 Bumped version: $CURRENT → $NEW"
        echo "   Commit it, then run 'task release'."

  preflight:
    silent: true
    internal: true
    cmds:
      - |
        SHARD_VERSION=$(grep -E '^version:' shard.yml | sed -E 's/^version:[[:space:]]*//')
        if [ "$SHARD_VERSION" != "{{.VERSION}}" ]; then
          echo "❌ shard.yml says $SHARD_VERSION but {{.VERSION_FILE}} says {{.VERSION}} — run 'task bump' or fix by hand"
          exit 1
        fi
        BRANCH=$(git rev-parse --abbrev-ref HEAD)
        if [ "$BRANCH" != "main" ]; then
          echo "❌ releases are cut from main, not '$BRANCH'"
          exit 1
        fi
        # The tag must point at exactly what is being built.
        if [ -n "$(git status --porcelain)" ]; then
          echo "❌ working tree is not clean — commit or stash first"
          git status --short
          exit 1
        fi
        if git rev-parse -q --verify "refs/tags/{{.TAG}}" > /dev/null; then
          echo "❌ tag {{.TAG}} already exists locally — bump the version first"
          exit 1
        fi
        if git ls-remote --exit-code --tags origin "refs/tags/{{.TAG}}" > /dev/null 2>&1; then
          echo "❌ tag {{.TAG}} already exists on origin — bump the version first"
          exit 1
        fi

  dist:
    silent: true
    desc: Release build to dist/jwtpeek-<os>-<arch> with a sha256 next to it
    cmds:
      - |
        mkdir -p {{.DIST}}
        echo "🔨 Building {{.ASSET}} ({{.TAG}})"
        crystal build src/{{.BIN}}.cr --release --no-debug -o {{.DIST}}/{{.ASSET}}
        # macOS ships shasum, not sha256sum; both print the same "<hash>  <file>" line.
        if command -v sha256sum > /dev/null 2>&1; then
          (cd {{.DIST}} && sha256sum {{.ASSET}} > {{.ASSET}}.sha256)
        else
          (cd {{.DIST}} && shasum -a 256 {{.ASSET}} > {{.ASSET}}.sha256)
        fi
        echo "✅ {{.DIST}}/{{.ASSET}} ($(du -h {{.DIST}}/{{.ASSET}} | cut -f1))"

  release:
    desc: Verify, tag vX.Y.Z and push — the release workflow builds and publishes from the tag
    silent: true
    cmds:
      - task: preflight
      - task: verify
      - |
        echo "🏷  Tagging {{.TAG}}"
        git tag -a "{{.TAG}}" -m "Release {{.TAG}}"
        git push origin main
        git push origin "{{.TAG}}"
        echo ""
        echo "✅ Pushed {{.TAG}}. The release workflow is now building Linux and macOS binaries:"
        echo "   $(gh repo view --json url -q .url 2>/dev/null || echo https://github.com/Lillevang/jwtpeek)/actions"
        echo "   Fallback if it fails: task dist publish"

  check-tag:
    desc: Fail unless HEAD carries the tag that matches src/version.cr
    silent: true
    cmds:
      - |
        # Guards the workflow against a tag pushed without bumping the version
        # (the assets would be labelled with the old version) and `publish`
        # against attaching a build of the wrong commit.
        if ! git tag --points-at HEAD | grep -qx "{{.TAG}}"; then
          echo "❌ HEAD is not tagged {{.TAG}} (src/version.cr says {{.VERSION}})"
          echo "   tags at HEAD: $(git tag --points-at HEAD | tr '\n' ' ')"
          echo "   run 'task release' to tag, or fix the version first"
          exit 1
        fi

  publish:
    desc: Create or update the GitHub release for the current tag from dist/
    silent: true
    cmds:
      - task: check-tag
      - |
        gh auth status > /dev/null 2>&1 || { echo "❌ gh is not logged in — run 'gh auth login' (or set GH_TOKEN)"; exit 1; }
        ls {{.DIST}}/{{.BIN}}-* > /dev/null 2>&1 || { echo "❌ nothing in {{.DIST}}/ — run 'task dist' first"; exit 1; }
        # The workflow builds one asset per OS; whichever job publishes first
        # creates the release and later ones only add their files. `--clobber`
        # makes a re-run replace assets instead of failing on the duplicate.
        if gh release view "{{.TAG}}" > /dev/null 2>&1; then
          echo "📦 Release {{.TAG}} exists — uploading assets"
          gh release upload "{{.TAG}}" {{.DIST}}/{{.BIN}}-* --clobber
        else
          echo "📦 Creating release {{.TAG}}"
          gh release create "{{.TAG}}" --title "{{.TAG}}" --generate-notes {{.DIST}}/{{.BIN}}-*
        fi
        echo "✅ $(gh release view "{{.TAG}}" --json url -q .url)"

  clean:
    desc: Remove build outputs
    cmds:
      - rm -rf bin {{.DIST}} .crystal
